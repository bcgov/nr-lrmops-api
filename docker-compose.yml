# Reusable vars
x-var:
  - &node-image node:22

services:
  backend:
    container_name: backend
    entrypoint: sh -c "npm i && npm run start:dev"
    environment:
      NODE_ENV: development
    image: *node-image
    ports: ["3001:3000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api"]
    working_dir: "/app"
    volumes: ["./backend:/app", "/app/node_modules"]
