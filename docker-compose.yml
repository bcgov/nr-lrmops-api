# Local development: the Spring Boot API on http://localhost:8080.
#
# Prereqs (host machine):
#   1. BC Gov VPN connected: the Oracle host is reached through the host's routing.
#   2. backend/src/main/resources/application-local.yml (gitignored) holds the database and
#      Keycloak values the `local` profile reads; see backend/.env.example for the names.
#   3. backend/src/main/resources/cert/jssecacerts (gitignored) is the Oracle TCPS truststore.
#
# No hot reload: restart the service after Java changes (`docker compose restart backend`).
# The first `up` downloads the Maven cache; the maven-cache volume keeps it.

x-var:
  - &java-image maven:3.9.16-amazoncorretto-21-alpine

services:
  backend:
    image: *java-image
    container_name: backend
    working_dir: /app
    entrypoint: sh -c "mvn -B -DskipTests spring-boot:run"
    environment:
      SPRING_PROFILES_ACTIVE: local
      TRUSTSTORE_PATH: /app/src/main/resources/cert/jssecacerts
    ports: ["8080:8080"]
    volumes:
      - ./backend:/app
      - maven-cache:/root/.m2
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

volumes:
  maven-cache:
