name: Merge

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.github/**'
      - '.github/graphics/**'
      - '!.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  init:
    name: Initialize
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    runs-on: ubuntu-26.04
    steps:
      # Get PR number for squash merges to main
      - id: pr
        uses: bcgov/action-get-pr@28b0adf8e4d40720d41f9c87356ce24b0a4bd6af # v0.3.1
  deploy-test:
    name: TEST Deploys (${{ needs.init.outputs.pr }})
    needs: [init]
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      oc_namespace: ${{ secrets.oc_namespace }}
      oc_token: ${{ secrets.oc_token }}
      database_host: ${{ secrets.database_host }}
      database_service_name: ${{ secrets.database_service_name }}
      database_user: ${{ secrets.database_user }}
      database_password: ${{ secrets.database_password }}
      keystore_secret: ${{ secrets.keystore_secret }}
      keycloak_sa_client_id: ${{ secrets.keycloak_sa_client_id }}
      keycloak_sa_client_secret: ${{ secrets.keycloak_sa_client_secret }}
    with:
      environment: test
      target: test
      tag: ${{ needs.init.outputs.pr }}

  tests:
    name: Tests
    needs: [deploy-test]
    uses: ./.github/workflows/reusable-tests.yml
    with:
      target: test

  # ── PROD deploy + monitor + promote: DISABLED ════════════════════════
  #
  # The API must not deploy to PROD until go-live. The three jobs below are
  # commented out rather than guarded by an `if:` so that no combination of
  # inputs, re-run or workflow_dispatch can reach production: a condition is
  # something you can get wrong, an absent job is not. There is no release
  # workflow either, so nothing in this repo can deploy PROD.
  #
  # Merges to main deploy TEST only (see `deploy-test` above). PR previews go
  # to the dev namespace via pr-open.yml.
  #
  # They are disabled AS A SET, and must be re-enabled as a set: `monitor-prod`
  # and `promote` declare `needs: [deploy-prod]`, so uncommenting one on its own
  # makes the WHOLE workflow file invalid, and every run fails, TEST included.
  # Add all three back to `results.needs` below when re-enabling.
  #
  # Before the first PROD enable, confirm all of:
  #   - The prod namespace exists, and the `prod` GitHub Environment carries
  #     OC_NAMESPACE / OC_TOKEN.
  #   - KEYCLOAK_SA_ISSUER_URI on the `prod` Environment points at the PROD
  #     realm, and KEYCLOAK_SA_CLIENT_ID / _SECRET (if set) is a PROD-realm
  #     service account, so the API's scopes are created there.
  #   - The Oracle credentials on the `prod` Environment reach the PROD
  #     database (DBP05), not TEST, and the proxy user and grants exist there.
  #   - ALLOWED_ORIGINS on the `prod` Environment lists the PROD browser apps.
  #
  # deploy-prod:
  #   name: PROD Deploys (${{ needs.init.outputs.pr }})
  #   needs: [tests, init]
  #   uses: ./.github/workflows/reusable-deploy.yml
  #   secrets:
  #     oc_namespace: ${{ secrets.oc_namespace }}
  #     oc_token: ${{ secrets.oc_token }}
  #     database_host: ${{ secrets.database_host }}
  #     database_service_name: ${{ secrets.database_service_name }}
  #     database_user: ${{ secrets.database_user }}
  #     database_password: ${{ secrets.database_password }}
  #     keystore_secret: ${{ secrets.keystore_secret }}
  #     keycloak_sa_client_id: ${{ secrets.keycloak_sa_client_id }}
  #     keycloak_sa_client_secret: ${{ secrets.keycloak_sa_client_secret }}
  #   with:
  #     environment: prod
  #     target: prod
  #     tag: ${{ needs.init.outputs.pr }}

  # # Sync Sysdig email alerts for PROD. No-ops cleanly if SYSDIG_API_TOKEN is
  # # unset or monitoring/alerts/ is empty — adoption is gradual. Alert
  # # templates live in monitoring/alerts/ in this repo; add or remove files
  # # there to customize the alert set.
