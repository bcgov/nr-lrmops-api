  #   environment: prod
  #   permissions:
  #     contents: read
  #   timeout-minutes: 5
  #   steps:
  #     - uses: actions/checkout@v7
  #     # 0.0.3 is the first version with __APP__ template substitution, which
  #     # monitoring/alerts/*.json depend on — don't downgrade this pin.
  #     - uses: bcgov/actions-openshift/sysdig-monitor@a7a039ba45f9635c0bdbcc6b4cdbd2555811e100 # v0.8.0
  #       with:
  #         sysdig_api_token: ${{ secrets.SYSDIG_API_TOKEN }}
  #         oc_namespace: ${{ secrets.OC_NAMESPACE }}
  #         app: ${{ github.event.repository.name }}
  #         components: |
  #           backend

  # promote:
  #   name: Promote Images
  #   needs: [deploy-prod, init]
  #   runs-on: ubuntu-slim
  #   permissions:
  #     packages: write
  #   strategy:
  #     matrix:
  #       package: [backend]
  #   timeout-minutes: 1
  #   steps:
  #     - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5
  #       with:
  #         registry: ghcr.io
  #         repository: ${{ github.repository }}/${{ matrix.package }}
  #         target: ${{ needs.init.outputs.pr }}
  #         tags: prod

  results:
    name: Merge Results
    needs: [init, deploy-test, tests]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: bcgov/actions/workflow-results@d209bb08aabe15e5e69aca53b24d338a7b2843d5 # v0.12.0
        with:
          needs: ${{ toJson(needs) }}
          title: Merge Results
